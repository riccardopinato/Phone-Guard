name: Build signed INTERNAL

on:
  workflow_dispatch: {}
  push:
    tags:
      - "internal-v*"
    branches:
      - "internal-release/**"

permissions:
  contents: read

concurrency:
  group: phone-guard-internal-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPECTED_CERT_SHA256: 0ECAF920E114037CDC090E30950A130439A3F2E4FFE66F486EE41739F2BBA654

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require signing secrets
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then missing+=("$name"); fi
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "::error::Missing signing secrets: ${missing[*]}"
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: '9.3.1'
          cache-provider: basic

      - name: Restore INTERNAL keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p .signing
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > .signing/internal.jks
          chmod 600 .signing/internal.jks

      - name: Build and validate
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/.signing/internal.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle :app:testDebugUnitTest :app:lintRelease :app:assembleRelease :app:bundleRelease --no-daemon --stacktrace

      - name: Verify APK and AAB signing certificate
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          AAB="app/build/outputs/bundle/release/app-release.aab"
          test -s "$APK"
          test -s "$AAB"

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -x "$APKSIGNER"

          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee /tmp/apksigner.txt
          APK_CERT="$(awk -F': ' '/certificate SHA-256 digest:/ {print $NF; exit}' /tmp/apksigner.txt | tr '[:lower:]' '[:upper:]' | tr -d ':[:space:]')"

          keytool -printcert -jarfile "$AAB" | tee /tmp/aab-cert.txt
          AAB_CERT="$(awk -F': ' '/SHA256:/ {print $NF; exit}' /tmp/aab-cert.txt | tr '[:lower:]' '[:upper:]' | tr -d ':[:space:]')"

          for pair in "APK:$APK_CERT" "AAB:$AAB_CERT"; do
            TYPE="${pair%%:*}"
            ACTUAL="${pair#*:}"
            if [ -z "$ACTUAL" ]; then
              echo "::error::Could not read $TYPE certificate SHA-256"
              exit 1
            fi
            if [ "$ACTUAL" != "$EXPECTED_CERT_SHA256" ]; then
              echo "::error::$TYPE signing certificate mismatch"
              echo "Expected: $EXPECTED_CERT_SHA256"
              echo "Actual:   $ACTUAL"
              exit 1
            fi
            echo "$TYPE signing certificate verified: $ACTUAL"
          done

      - name: Collect artifacts and hashes
        shell: bash
        run: |
          set -euo pipefail
          OUT="build/release-artifacts"
          mkdir -p "$OUT"
          cp app/build/outputs/apk/release/app-release.apk "$OUT/Phone-Guard-internal.apk"
          cp app/build/outputs/bundle/release/app-release.aab "$OUT/Phone-Guard-internal.aab"
          (
            cd "$OUT"
            sha256sum Phone-Guard-internal.apk Phone-Guard-internal.aab > SHA256SUMS.txt
            printf 'source_sha=%s\n' "$GITHUB_SHA" > BUILD_IDENTITY.txt
            printf 'workflow_run=%s\n' "$GITHUB_RUN_ID" >> BUILD_IDENTITY.txt
            printf 'certificate_sha256=%s\n' "$EXPECTED_CERT_SHA256" >> BUILD_IDENTITY.txt
          )

      - name: Upload signed INTERNAL artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Phone-Guard-INTERNAL-${{ github.run_number }}
          path: |
            build/release-artifacts/Phone-Guard-internal.apk
            build/release-artifacts/Phone-Guard-internal.aab
            build/release-artifacts/SHA256SUMS.txt
            build/release-artifacts/BUILD_IDENTITY.txt
          if-no-files-found: error
          retention-days: 30

      - name: Remove temporary keystore
        if: always()
        shell: bash
        run: rm -rf .signing
